name: Check Upstream, Validate Links, and Push to TVB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */2 * *'

jobs:
  validate_and_push:
    runs-on: ubuntu-latest
    
    # 定义要操作的仓库信息
    env:
      UPSTREAM_REPO: hd9211/Tvbox1
      TARGET_REPO: ${{ github.repository_owner }}/tvb

    steps:
      - name: 1. Checkout UPSTREAM Repository (hd9211/Tvbox1)
        uses: actions/checkout@v4
        with:
          # 直接签出源仓库的代码，无需 PAT
          repository: ${{ env.UPSTREAM_REPO }}
          path: upstream-repo

      - name: 2. Setup Python and Install Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests

      - name: 3. Create Validation Script
        run: |
          cat << 'EOF' > validate_links.py
          import json
          import requests
          import sys
          import os
          from concurrent.futures import ThreadPoolExecutor

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'}
          TIMEOUT = 8

          def check_url(url):
              if not url or not url.startswith(('http://', 'https://')):
                  print(f"SKIPPING: Invalid URL format {url}")
                  return False, url
              try:
                  response = requests.get(url, timeout=TIMEOUT, headers=HEADERS, allow_redirects=True, stream=True)
                  if 200 <= response.status_code < 400:
                      print(f"SUCCESS: {url} (Status: {response.status_code})")
                      return True, url
                  else:
                      print(f"FAIL: {url} (Status: {response.status_code})")
                      return False, url
              except requests.RequestException as e:
                  print(f"ERROR: {url} ({e})")
                  return False, url

          def process_file(filepath):
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}. Skipping.")
                  return

              print(f"\nProcessing file: {filepath}")
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"Error reading or decoding {filepath}: {e}")
                  return

              key_list = None
              if 'sites' in data and isinstance(data['sites'], list):
                  key_list = 'sites'
              elif 'urls' in data and isinstance(data['urls'], list):
                  key_list = 'urls'
              else:
                  print(f"Unknown JSON structure in {filepath}. Skipping.")
                  return
              
              items = data.get(key_list, [])
              urls_to_check = []
              for item in items:
                  if isinstance(item, dict):
                      url = item.get('url') or item.get('api') or item.get('sourceUrl')
                      if url:
                          urls_to_check.append((url, item))
                      else:
                          print(f"SKIPPING item: No known URL key ('url', 'api', or 'sourceUrl') found in {item}")

              if not urls_to_check:
                  print(f"No URLs found to check in {filepath}.")
                  return

              valid_items = []
              with ThreadPoolExecutor(max_workers=10) as executor:
                  results = executor.map(check_url, [u[0] for u in urls_to_check])
                  
                  for (is_valid, url), item in zip(results, [u[1] for u in urls_to_check]):
                      if is_valid:
                          valid_items.append(item)

              data[key_list] = valid_items
              try:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=4)
                  print(f"Processed {filepath}. Kept {len(valid_items)} / {len(items)} items.")
              except Exception as e:
                  print(f"Error writing processed file {filepath}: {e}")

          if __name__ == "__main__":
              files_to_process = sys.argv[1:]
              if not files_to_process:
                  print("No files specified.")
                  sys.exit(1)
              
              for f in files_to_process:
                  process_file(f)
          EOF


      - name: 4. Run Validation Script (on Upstream files)
        run: |
          # 直接对签出的源仓库文件进行验证和修改
          python validate_links.py upstream-repo/优质.json upstream-repo/cr.json upstream-repo/duocang1.json

      - name: 5. Checkout Private Repo 'tvb'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_TVB }} 
          repository: ${{ env.TARGET_REPO }}
          path: tvb-repo
          
      - name: 6. Copy Filtered Files and Push
        run: |
          # 确保目标目录存在（解决 cp 错误）
          mkdir -p tvb-repo/tvb/TVbox/
          
          # 拷贝文件
          cp upstream-repo/优质.json tvb-repo/tvb/TVbox/
          cp upstream-repo/cr.json tvb-repo/tvb/TVbox/
          cp upstream-repo/duocang1.json tvb-repo/tvb/TVbox/
          
          cd tvb-repo
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 只有当文件有变化时才提交和推送
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: Auto-update and validate Tvbox sources from upstream"
            git push
            echo "✅ Successfully pushed validated files to tvb repo."
          else
            echo "ℹ️ No changes to commit to tvb repo."
          fi
