name: Auto-Validate and Push to TVB on Upstream Change

on:
  workflow_dispatch:
  # 定时任务：每隔一天运行一次，确保不会错过更新
  schedule:
    - cron: '0 0 */2 * *'

jobs:
  validate_and_push:
    runs-on: ubuntu-latest
    
    env:
      UPSTREAM_REPO: hd9211/Tvbox1
      TARGET_REPO: ${{ github.repository_owner }}/tvb
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: main

    steps:
      - name: 1. Checkout TARGET Repo (tvb)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_TVB }} 
          repository: ${{ env.TARGET_REPO }}
          path: tvb-repo
          ref: ${{ env.TARGET_BRANCH }}

      - name: 2. Get Last Upstream Commit SHA
        id: get_sha
        run: |
          # 获取源仓库的最新提交SHA
          UPSTREAM_SHA=$(git ls-remote https://github.com/${{ env.UPSTREAM_REPO }}.git ${{ env.UPSTREAM_BRANCH }} | awk '{print $1}')
          
          # 检查 tvb 仓库中是否存有上次的SHA记录文件
          SHA_FILE="tvb-repo/last_upstream_sha.txt"
          
          if [ -f "$SHA_FILE" ]; then
            LAST_SHA=$(cat "$SHA_FILE")
            echo "上次记录的源仓库 SHA: $LAST_SHA"
            echo "源仓库最新 SHA: $UPSTREAM_SHA"
            
            if [ "$LAST_SHA" = "$UPSTREAM_SHA" ]; then
              echo "✅ 源仓库无新提交。跳过后续步骤。"
              echo "HAS_UPDATES=false" >> $GITHUB_ENV
            else
              echo "🔥 源仓库有新提交。继续验证。"
              echo "HAS_UPDATES=true" >> $GITHUB_ENV
            fi
          else
            echo "⚠️ 首次运行或SHA文件丢失。默认继续运行。"
            echo "HAS_UPDATES=true" >> $GITHUB_ENV
          fi
          
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
      
      - name: 3. Checkout UPSTREAM Repo Code
        if: env.HAS_UPDATES == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          path: upstream-repo

      - name: 4. Setup Python and Install Dependencies
        if: env.HAS_UPDATES == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - if: env.HAS_UPDATES == 'true'
        run: pip install requests

      - name: 5. Create Validation Script (with JSON Error Handling)
        if: env.HAS_UPDATES == 'true'
        run: |
          cat << 'EOF' > validate_links.py
          import json
          import requests
          import sys
          import os
          from concurrent.futures import ThreadPoolExecutor

          HEADERS = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'}
          TIMEOUT = 8

          def check_url(url):
              if not url or not url.startswith(('http://', 'https://')):
                  print(f"SKIPPING: Invalid URL format {url}")
                  return False, url
              try:
                  response = requests.get(url, timeout=TIMEOUT, headers=HEADERS, allow_redirects=True, stream=True)
                  if 200 <= response.status_code < 400:
                      print(f"SUCCESS: {url} (Status: {response.status_code})")
                      return True, url
                  else:
                      print(f"FAIL: {url} (Status: {response.status_code})")
                      return False, url
              except requests.RequestException as e:
                  print(f"ERROR: {url} ({e})")
                  return False, url

          def process_file(filepath):
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}. Skipping.")
                  return

              print(f"\nProcessing file: {filepath}")
              
              data = None
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                      content = content.strip()
                      data = json.loads(content)
                      
              except json.JSONDecodeError as e:
                  print(f"Error reading or decoding {filepath}: {e}")
                  print("Attempting to fix common TVBox JSON errors...")
                  
                  try:
                      start_curly = content.find('{')
                      end_curly = content.rfind('}')
                      start_square = content.find('[')
                      end_square = content.rfind(']')
                      
                      # 确定主要结构是对象还是数组，取范围最大的
                      if start_curly != -1 and end_curly != -1 and end_curly > start_curly:
                          start = start_curly
                          end = end_curly
                      elif start_square != -1 and end_square != -1 and end_square > start_square:
                          start = start_square
                          end = end_square
                      else:
                           print("Could not find valid JSON delimiters. Skipping file.")
                           return # 无法修复，跳过
                           
                      # 截取可能是有效 JSON 的部分
                      fixed_content = content[start:end+1]
                      data = json.loads(fixed_content)
                      print("Successfully fixed and loaded content.")
                           
                  except Exception as fix_e:
                      print(f"Fix failed: {fix_e}. Skipping file.")
                      return # 修复再次失败，跳过
              except Exception as e:
                  print(f"Error reading {filepath}: {e}")
                  return

              if data is None:
                  return

              key_list = None
              if 'sites' in data and isinstance(data['sites'], list):
                  key_list = 'sites'
              elif 'urls' in data and isinstance(data['urls'], list):
                  key_list = 'urls'
              else:
                  print(f"Unknown JSON structure in {filepath}. Skipping.")
                  return
              
              items = data.get(key_list, [])
              urls_to_check = []
              for item in items:
                  if isinstance(item, dict):
                      url = item.get('url') or item.get('api') or item.get('sourceUrl')
                      if url:
                          urls_to_check.append((url, item))
                      else:
                          print(f"SKIPPING item: No known URL key ('url', 'api', or 'sourceUrl') found in {item}")

              if not urls_to_check:
                  print(f"No URLs found to check in {filepath}.")
                  return

              valid_items = []
              with ThreadPoolExecutor(max_workers=10) as executor:
                  results = executor.map(check_url, [u[0] for u in urls_to_check])
                  
                  for (is_valid, url), item in zip(results, [u[1] for u in urls_to_check]):
                      if is_valid:
                          valid_items.append(item)

              data[key_list] = valid_items
              try:
                  with open(filepath, 'w', encoding='utf-8') as f:
                      json.dump(data, f, ensure_ascii=False, indent=4)
                  print(f"Processed {filepath}. Kept {len(valid_items)} / {len(items)} items.")
              except Exception as e:
                  print(f"Error writing processed file {filepath}: {e}")

          if __name__ == "__main__":
              files_to_process = sys.argv[1:]
              if not files_to_process:
                  print("No files specified.")
                  sys.exit(1)
              
              for f in files_to_process:
                  process_file(f)
          EOF

      - name: 6. Run Validation Script
        if: env.HAS_UPDATES == 'true'
        run: |
          python validate_links.py upstream-repo/优质.json upstream-repo/cr.json upstream-repo/duocang1.json

      - name: 7. Copy Filtered Files and Push to TVB
        if: env.HAS_UPDATES == 'true'
        run: |
          cd tvb-repo
          
          # 确保目标目录存在
          mkdir -p tvb/TVbox/
          
          # 拷贝文件
          cp ../upstream-repo/优质.json tvb/TVbox/
          cp ../upstream-repo/cr.json tvb/TVbox/
          cp ../upstream-repo/duocang1.json tvb/TVbox/
          
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 检查是否有内容变化 (包括链接验证导致的修改)
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: Auto-update and validate Tvbox sources from upstream (SHA: ${{ env.UPSTREAM_SHA }})"
            
            # 记录最新的源仓库 SHA 到 tvb 仓库中，并修正到上次提交
            echo "${{ env.UPSTREAM_SHA }}" > last_upstream_sha.txt
            git add last_upstream_sha.txt
            git commit --amend --no-edit
            
            git push origin ${{ env.TARGET_BRANCH }}
            echo "✅ Successfully pushed validated files and updated SHA to tvb repo."
          else
            # 如果文件没有变化，只更新 SHA 文件
            echo "${{ env.UPSTREAM_SHA }}" > last_upstream_sha.txt
            git add last_upstream_sha.txt
            git commit -m "chore: Update last_upstream_sha.txt (SHA: ${{ env.UPSTREAM_SHA }}) - No file changes or validation needed"
            git push origin ${{ env.TARGET_BRANCH }}
            echo "ℹ️ Files unchanged, but updated last_upstream_sha.txt to avoid rerunning next time."
          fi
